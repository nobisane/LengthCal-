[package]
name = "lengthcal"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "~1.19", features = ["backend-android-activity-06"] }

[build-dependencies]
slint-build = "~1.19"

# The APK is built with the dev profile (auto-signed with a debug key),
# so optimise it here.
[profile.dev]
opt-level = 3
debug = false
strip = true

[package.metadata.android]
package = "com.lengthcal.app"
apk_name = "lengthcal"
build_targets = ["aarch64-linux-android"]
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 34

[package.metadata.android.application]
label = "Lengthcal"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
orientation = "portrait"
config_changes = "orientation|keyboardHidden|screenSize"
